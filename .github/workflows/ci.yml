name: CI

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  test:
    name: Lint, build, and contract tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - name: Verify Node version
        run: node --version

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test
